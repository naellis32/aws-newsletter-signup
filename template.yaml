AWSTemplateFormatVersion: '2010-09-09'
Description: Newsletter Email Collection Infrastructure - S3 and Elastic Beanstalk Application

Resources:
  EmailStorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  NewsletterApplication:
    Type: AWS::ElasticBeanstalk::Application
    Properties:
      ApplicationName: NewsletterEmailCollector
      Description: Simple web portal collecting emails for the newsletter

Outputs:
  S3BucketName:
    Description: Name of the created S3 storage bucket
    Value: !Ref EmailStorageBucket

  ApplicationName:
    Description: Name of the Elastic Beanstalk Application
    Value: !Ref NewsletterApplication